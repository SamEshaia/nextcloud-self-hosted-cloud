# Apache HTTPS VirtualHost for Nextcloud (tarball deployment)
# Place at /etc/apache2/sites-available/nextcloud-ssl.conf
# Run: sudo certbot --apache -d <nextcloud_hostname>  (certbot manages the SSL vhost)
# Replace <nextcloud_hostname> with your public FQDN.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName <nextcloud_hostname>
    ServerAdmin <admin_email>
    DocumentRoot /var/www/nextcloud/

    <Directory /var/www/nextcloud/>
        Require all granted
        AllowOverride All
        Options FollowSymLinks MultiViews
        <IfModule mod_dav.c>
            Dav off
        </IfModule>
    </Directory>

    # Never serve the data directory or config over HTTP
    <Directory /var/www/nextcloud/data/>
        Require all denied
    </Directory>
    <Directory /var/www/nextcloud/config/>
        Require all denied
    </Directory>

    # Security headers Nextcloud's admin overview checks for
    Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Permitted-Cross-Domain-Policies "none"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/<nextcloud_hostname>/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/<nextcloud_hostname>/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/nextcloud-error.log
    CustomLog ${APACHE_LOG_DIR}/nextcloud-access.log combined
</VirtualHost>
</IfModule>