# Apache VirtualHost for Nextcloud (tarball deployment)
# Place at /etc/apache2/sites-available/nextcloud.conf
# Replace <nextcloud_hostname> with your public FQDN.
#
# HTTP vhost: ACME challenges + redirect to HTTPS

<VirtualHost *:80>
    ServerName <nextcloud_hostname>
    ServerAdmin <admin_email>
    DocumentRoot /var/www/nextcloud/

    # Let certbot serve ACME challenges here
    <Directory /var/www/nextcloud/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>